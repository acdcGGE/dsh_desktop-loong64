# ============================================================
# dsh_desktop-loong64 —— 上游跟踪配置
# 由 check-upstream.sh / sync-upstream.sh 读取与维护
# ------------------------------------------------------------
# 作用: 记录"本地已构建并验证"的版本, 以及上游仓库信息,
#       以便检测 deepseek-harness 官方是否发布了新版本。
# ============================================================

# 官方上游仓库 (GitHub)
UPSTREAM_REPO="deepseek-ai/deepseek-harness"

# 第三方龙芯移植参考仓库 (仅作参考, 非逐字照搬)
REFERENCE_REPO="Chen-Yuanmeng/dsh-loongarch-adaption"

# 本地已构建并验证的版本 (由 sync-upstream.sh --apply 自动更新)
LOCAL_VERSION="0.2.1-rc.5"
LOCAL_COMMIT="b830ec950faba0a46dda564be3e2d854afed94f1"
LOCAL_COMMIT_DATE="2026-10-29"

# 本地上游源码工作树 (可选; 若存在则用 git 精确比对新 commit)
# 默认同级 dsh 目录; 如不存在则仅用 GitHub API 做版本号比较
UPSTREAM_LOCAL_DIR="../dsh"

# 同步后默认产出的包格式 (由 sync-upstream.sh 读取; 可用 --formats 覆盖)
#   deb  -> make-deb.sh   (Debian/Ubuntu, dpkg -i)
#   pkg  -> make-pkg.sh   (Arch Linux loong64, pacman -U)
# 需要额外的 tar.gz 可分发包时, 运行 sync-upstream.sh 时加 --with-tarball
PACKAGE_FORMATS="deb pkg"

# ---- 以下字段由脚本自动维护, 无需手改 ----
LAST_CHECKED="2026-11-04 12:41:52 CST"
LAST_UPSTREAM_VERSION="dsh-v0.2.2-alpha.3"
# 最近一次检查看到的上游最新 rc (仅预发布), 用于判断"是否有新的 rc"
LAST_SEEN_RC="dsh-v0.2.1-rc.5"
